# =============================================================================
# Lion Park — nginx: serve a SPA e faz proxy da API
# =============================================================================
# O navegador conversa APENAS com este servidor. As chamadas para /api são
# encaminhadas ao contêiner do backend pela rede interna do Docker, o que torna
# tudo mesma origem — sem CORS, sem porta de API exposta ao usuário.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compressão --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff font/woff2;

    # ---- Cabeçalhos de segurança -------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ---- Proxy da API ------------------------------------------------------
    # "backend" resolve pelo DNS interno do Docker Compose (nome do serviço).
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Respostas de API nunca são cacheadas
        add_header Cache-Control "no-store" always;
    }

    # ---- Cache dos assets com hash no nome ---------------------------------
    # outputHashing: "all" garante nome novo a cada build, então o cache
    # longo é seguro e o usuário nunca recebe arquivo obsoleto.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html sempre revalidado --------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Fallback da SPA ---------------------------------------------------
    # Rotas do Angular (/dashboard, /entries...) não existem como arquivo.
    # Sem esta linha, recarregar a página em qualquer rota daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Sonda de saúde ----------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
