<div class="space-y-6 animate-fade-in-up">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center">
        <div class="i-mdi-cash-multiple text-2xl text-blue-600"></div>
      </div>
      <div>
        <h3 class="text-xl font-black text-slate-800 tracking-tight">Tabela de Preços</h3>
        <p class="text-sm font-medium text-slate-500">Configure os valores para diferentes períodos</p>
      </div>
    </div>

    <form [formGroup]="priceForm" (ngSubmit)="onSubmit()"
      class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end pt-4 border-t border-slate-100">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Categoria</label>
        <select formControlName="type"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium shadow-sm appearance-none outline-none cursor-pointer">
          <option value="Fração">Fração (Até 30 min)</option>
          <option value="Hora">Hora</option>
          <option value="Diária">Diária</option>
          <option value="Mensal">Mensal</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Descrição</label>
        <input type="text" formControlName="name"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium shadow-sm outline-none"
          placeholder="Ex: 1ª Hora">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Valor (R$)</label>
        <input type="number" step="0.01" formControlName="price"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium shadow-sm outline-none">
      </div>
      <button type="submit" [disabled]="priceForm.invalid || isSubmitting()"
        class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg shadow-slate-900/20 transition-all disabled:opacity-50 h-[50px] flex items-center justify-center gap-2">
        <div class="i-mdi-plus text-xl"></div>
        Adicionar
      </button>
    </form>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="px-6 py-5 border-b border-slate-100">
      <h3 class="text-lg font-bold text-slate-800">Regras Cadastradas</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 text-slate-500 text-sm uppercase tracking-wider">
            <th class="px-6 py-4 font-bold border-b border-slate-100">Categoria</th>
            <th class="px-6 py-4 font-bold border-b border-slate-100 w-1/3">Descrição</th>
            <th class="px-6 py-4 font-bold border-b border-slate-100">Valor</th>
            <th class="px-6 py-4 font-bold border-b border-slate-100 text-right">Ação</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (rule of priceRules(); track rule.id) {
          <tr class="hover:bg-slate-50/50 transition-colors">
            <td class="px-6 py-4">
              <span
                class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-100 font-bold text-xs uppercase tracking-wider rounded-md">{{
                rule.type }}</span>
            </td>
            <td class="px-6 py-4 font-semibold text-slate-800">{{ rule.name }}</td>
            <td class="px-6 py-4 font-bold text-emerald-600">{{ rule.price | currency:'BRL' }}</td>
            <td class="px-6 py-4 text-right">
              <button (click)="removeRule(rule.id)"
                class="p-2.5 text-rose-500 hover:bg-rose-50 rounded-xl transition-colors border border-transparent hover:border-rose-100">
                <div class="i-mdi-delete-outline text-xl"></div>
              </button>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="4" class="px-6 py-12 text-center text-slate-400 font-medium">
              Nenhuma regra de preço configurada no momento.
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
