<div class="min-h-screen flex font-sans bg-white selection:bg-blue-600/20">
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 relative bg-[#F8FAFC]">
    <div class="w-full max-w-md animate-fade-in-up">
      <div class="lg:hidden flex items-center gap-3 mb-12">
        <div class="i-mdi-lion text-4xl text-blue-600"></div>
        <span class="text-2xl font-black text-slate-900 tracking-widest uppercase">Lion Park</span>
      </div>

      <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-2">Acessar sistema</h2>
      <p class="text-slate-500 mb-10 text-lg font-medium">Insira suas credenciais para continuar.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5 tracking-wide">E-mail Corporativo</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <div class="i-mdi-email text-slate-400 text-xl group-focus-within:text-blue-600 transition-colors"></div>
            </div>
            <input type="email" formControlName="email"
              class="w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium shadow-sm outline-none"
              placeholder="operador@lionpark.com">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5 tracking-wide">Senha de Acesso</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <div class="i-mdi-lock text-slate-400 text-xl group-focus-within:text-blue-600 transition-colors"></div>
            </div>
            <input type="password" formControlName="password"
              class="w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium shadow-sm outline-none"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isSubmitting()"
          class="w-full py-4 mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed text-base tracking-wide flex items-center justify-center gap-2">
          @if (isSubmitting()) {
          <div class="i-mdi-loading animate-spin text-xl"></div>
          Validando...
          } @else {
          Entrar
          <div class="i-mdi-login text-xl"></div>
          }
        </button>
      </form>

      <p class="text-center text-slate-500 mt-10 font-medium">
        Ainda não tem acesso?
        <a routerLink="/register" class="text-slate-900 hover:text-blue-600 font-bold transition-colors ml-1">Criar
          conta</a>
      </p>
    </div>
  </div>

  <div
    class="hidden lg:flex w-1/2 bg-slate-950 relative overflow-hidden flex-col justify-between p-12 text-white shadow-2xl z-10">
    <div class="absolute inset-0 bg-gradient-to-bl from-blue-700/20 to-cyan-500/10 z-0 pointer-events-none"></div>
    <div
      class="absolute -top-[20%] -right-[10%] w-[70%] h-[70%] bg-blue-500/20 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div
      class="absolute bottom-[-10%] left-[-10%] w-[60%] h-[60%] bg-cyan-600/20 blur-[100px] rounded-full pointer-events-none">
    </div>

    <div class="z-10 flex items-center gap-3 animate-fade-in-up">
      <div class="i-mdi-lion text-4xl text-blue-400"></div>
      <span class="text-2xl font-black tracking-widest uppercase">Lion Park</span>
    </div>

    <div class="z-10 animate-fade-in-up" style="animation-delay: 0.1s">
      <h1 class="text-5xl font-black tracking-tight mb-6 leading-[1.15]">Bem-vindo<br>de volta.</h1>
      <p class="text-slate-400 text-xl max-w-md font-medium leading-relaxed">Acesse o painel de controle e tenha a visão
        completa do estacionamento em tempo real.</p>
    </div>

    <div class="z-10 text-sm text-slate-500 font-medium tracking-wide animate-fade-in-up" style="animation-delay: 0.2s">
      &copy; 2026 Lion Park Technologies.
    </div>
  </div>
</div>
