<div class="space-y-6 animate-fade-in-up">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center">
        <div class="i-mdi-parking text-2xl text-blue-600"></div>
      </div>
      <div>
        <h3 class="text-xl font-black text-slate-800 tracking-tight">Gestão de Vagas</h3>
        <p class="text-sm font-medium text-slate-500">Mapeamento físico do estacionamento</p>
      </div>
    </div>

    <form [formGroup]="spotForm" (ngSubmit)="onSubmit()"
      class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end pt-4 border-t border-slate-100">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Identificação da Vaga</label>
        <input type="text" formControlName="identification"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-mono uppercase shadow-sm"
          placeholder="Ex: A-01">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Categoria</label>
        <select formControlName="category"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:ring-2 focus:ring-blue-600/50 focus:border-blue-600 transition-all font-medium appearance-none shadow-sm cursor-pointer">
          <option value="Carro">Carro</option>
          <option value="Moto">Moto</option>
          <option value="PCD">PCD (Acessibilidade)</option>
          <option value="Van">Van / Utilitário</option>
        </select>
      </div>
      <button type="submit" [disabled]="spotForm.invalid || isSubmitting()"
        class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg shadow-slate-900/20 transition-all disabled:opacity-50 h-[50px] flex items-center justify-center gap-2">
        <div class="i-mdi-plus text-xl"></div>
        Registrar Vaga
      </button>
    </form>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="px-6 py-5 border-b border-slate-100">
      <h3 class="text-lg font-bold text-slate-800">Mapa de Vagas</h3>
    </div>

    <div class="p-6">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        @for (spot of spots(); track spot.id) {
        <div class="relative p-4 rounded-xl border-2 transition-all" [class.bg-emerald-50]="!spot.isOccupied"
          [class.border-emerald-200]="!spot.isOccupied" [class.bg-rose-50]="spot.isOccupied"
          [class.border-rose-200]="spot.isOccupied">

          <div class="absolute top-2 right-2">
            <div class="w-2.5 h-2.5 rounded-full" [class.bg-emerald-500]="!spot.isOccupied"
              [class.bg-rose-500]="spot.isOccupied"></div>
          </div>

          <div class="text-center mt-2">
            <div class="text-2xl font-black font-mono mb-1" [class.text-emerald-700]="!spot.isOccupied"
              [class.text-rose-700]="spot.isOccupied">
              {{ spot.identification }}
            </div>
            <div class="text-xs font-bold uppercase tracking-widest" [class.text-emerald-600/70]="!spot.isOccupied"
              [class.text-rose-600/70]="spot.isOccupied">
              {{ spot.category }}
            </div>
          </div>

          <div class="mt-3 text-center">
            <span class="text-[10px] font-bold uppercase px-2 py-1 rounded border"
              [class.bg-emerald-100]="!spot.isOccupied" [class.text-emerald-700]="!spot.isOccupied"
              [class.border-emerald-200]="!spot.isOccupied" [class.bg-rose-100]="spot.isOccupied"
              [class.text-rose-700]="spot.isOccupied" [class.border-rose-200]="spot.isOccupied">
              {{ spot.isOccupied ? 'Ocupada' : 'Livre' }}
            </span>
          </div>
        </div>
        } @empty {
        <div class="col-span-full py-12 text-center text-slate-400 font-medium">
          Nenhuma vaga registrada no pátio. Adicione a primeira vaga acima.
        </div>
        }
      </div>
    </div>
  </div>
</div>
